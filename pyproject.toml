[project]
name = "forge"
version = "0.1.0"
description = "Forge — a voice + gesture holographic 3D workshop driving Blender via a multi-agent AI (Wand x BlenderMCP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Shared dependencies. The server and client are run from the repo root as
# top-level packages (`server.server`, `client.companion_app`).
dependencies = [
    # ── Orchestration / Gemini Live (server) ──
    "google-adk>=0.2.0",
    "google-genai>=0.3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    # ── Vision / audio / native window (client, macOS) ──
    "mediapipe>=0.10",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "sounddevice>=0.4",
    "pyobjc>=10.0; sys_platform == 'darwin'",
    "pynput>=1.7",
    "Pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Enabled in Phase 5 (plan.md Step 14) for Firebase persistence.
cloud = [
    "firebase-admin>=6.5",
]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[project.scripts]
forge = "client.companion_app:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server", "client"]

[tool.ruff]
line-length = 100
target-version = "py310"
